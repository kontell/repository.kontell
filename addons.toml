# What the Kontell repository serves, and where each thing comes from.
#
# This replaces seven near-identical update-*.sh scripts. They had drifted from
# each other in ways that only matter once nobody is watching the output: some
# looked at the newest 5 releases and some at 20, and several *fell back to the
# latest draft* when no published release existed — reasonable for a human at a
# terminal, wrong for a cron job. tools/update.py reads this file and applies one
# code path to every entry.
#
# model = how an addon maps releases onto the served tree:
#
#   shared    Pure Python, one zip that works on every Kodi version. Copied into
#             <channel>/<id>/ for each channel unchanged.
#   dual      Per-channel releases, tagged omega/vX.Y.Z and piers/vX.Y.Z, whose
#             assets carry a -omega / -piers suffix. Each goes to its own channel.
#   binary    Compiled per platform. Assets land in <channel>/<id>+<os>-<arch>/.
#             The channel comes from the asset's -kodi<N> suffix where present,
#             otherwise from the version's major (21 -> omega, 22 -> piers, 23 -> kodi23), so
#             this works before and after the Kodi-numbering migration.
#   jellyfin  A Jellyfin *server* plugin, not a Kodi addon. Served from the same
#             site under jellyfin/ with its own manifest.json.
#   variant   One add-on id built from several branches, each for its own Kodi
#             versions. `variants` gives each branch a version range, and
#             `stable` / `dev` name the variant each channel serves.
#
# channels = the channels a shared, dual or binary add-on is served in
# (omega, piers, kodi23). Default: all of them. A channel left out keeps what its
# stable tree has and loses its dev directory.
#
# platforms = the full set a binary release must produce. update.py refuses to
# place a partial set: a half-published release leaves some platforms on an older
# build while addons.xml advertises the new version for the rest, and the whole
# point of automating this is that nobody is reading the output.

[[addon]]
# Three branches: sql (Omega onwards), api (Piers onwards) and master (Kodi 23
# alpha onwards). The ranges are also Kodi's upgrade path: a device takes the new
# channel's kofin after a Kodi upgrade only if its version is higher than the one
# installed, so sql < api < master has to hold for good.
id = "plugin.video.kofin"
repo = "kontell/plugin.video.kofin"
model = "variant"
variants.sql = { below = "0.90" }
variants.api = { from = "0.90", below = "0.95" }
variants.master = { from = "0.95" }
# Piers stays on sql until master has a full release that sets up a profile the
# SQL build wrote: every Piers user on this channel reaches it by auto-update.
# master (0.96.0 and up) is the one build for Piers and Kodi 23; api is retired.
stable = { omega = "sql", piers = "sql", kodi23 = "master" }
dev = { piers = "master", kodi23 = "master" }

[[addon]]
id = "script.kofin.lyrics"
repo = "kontell/script.kofin.lyrics"
model = "shared"

[[addon]]
id = "script.music.restore"
repo = "kontell/script.music.restore"
model = "shared"

[[addon]]
id = "script.skin.contuary"
repo = "kontell/script.skin.contuary"
model = "shared"

[[addon]]
id = "plugin.timeshiftsaver"
repo = "kontell/plugin.timeshiftsaver"
model = "shared"

[[addon]]
# Was plugin.audio.koshelf / kontell/KoShelf until 1.0.0. The name collided
# with an unrelated project; the old id is abandoned rather than migrated, so
# it is simply dropped from here and its served directories removed.
id = "plugin.audio.kotome"
repo = "kontell/plugin.audio.kotome"
model = "shared"

[[addon]]
# The one entry here whose id is not ours. This is a fork of sualfred's
# Embuary Info, which is abandoned upstream (last commit May 2022) and which
# ships a defect that can push Kodi into an out-of-memory kill on a TV box.
#
# Keeping the upstream id is what makes this useful rather than a curiosity.
# Kodi's AddonRepos::DoAddonUpdateCheck consults official repositories first,
# finds nothing above the 2.0.8 in repository.xbmc.org, and only then looks at
# private repositories -- and only for users who set "Update official add-ons
# from" (addons.updatemode) to "Any repositories". Those users get this build
# as an in-place upgrade; everyone else keeps upstream and never sees it. The
# id is also what context.embuary.info imports and what skin.contuary calls.
#
# Kodi's own help text for that setting names this exact case, so it is the
# sanctioned mechanism rather than a trick: "For cases such as updating from an
# add-ons beta repository this option can be switched to [Any repositories]".
#
# The version must stay ahead of both the released 2.0.8 and the unreleased
# 2.0.10 on upstream's matrix branch. If upstream ever ships above ours, the
# official repository reclaims the add-on -- which is the right failsafe.
id = "script.embuary.info"
repo = "kontell/script.embuary.info"
model = "shared"

[[addon]]
# Its release workflow drafts every release as a pre-release, so this is served
# from dev/ only and each run reports "not released yet" for the stable tree.
# That is expected until the companion cuts a full release. Not on Kodi 23,
# where kofin's master branch has no use for it.
id = "service.kofin.companion"
repo = "kontell/service.kofin.companion"
model = "shared"
channels = ["omega", "piers"]

[[addon]]
id = "skin.contuary"
repo = "kontell/skin.contuary"
model = "dual"

[[addon]]
id = "pvr.kofin"
repo = "kontell/pvr.kofin"
model = "binary"
# windows-arm64 is absent on purpose. This list applies to every channel, and
# Kodi 21 has no Windows arm64 build, so requiring it would refuse every Omega
# release as incomplete. A Piers release carries that zip and it is placed like
# any other; it is just not one whose absence stops the release.
platforms = [
  "linux-x86_64",
  "linux-armv7",
  "linux-aarch64",
  "android-armv7",
  "android-aarch64",
  "windows-x86_64",
  "windows-i686",
  "osx-x86_64",
  "osx-arm64",
]

[[addon]]
id = "inputstream.tempo"
repo = "kontell/inputstream.tempo"
model = "binary"
platforms = [
  "linux-x86_64",
  "linux-armv7",
  "linux-aarch64",
  "android-armv7",
  "android-aarch64",
  "windows-x86_64",
]

[[addon]]
id = "kofin-sync-queue"
repo = "kontell/jellyfin-plugin-kofinsyncqueue"
model = "jellyfin"
# Underscore, and a 4-part version, unlike the hyphenated Kodi naming.
asset_glob = "kofin-sync-queue_*.zip"

[[addon]]
id = "syncplay-v2"
repo = "kontell/jellyfin-plugin-syncplayv2"
model = "jellyfin"
asset_glob = "syncplay-v2_*.zip"
